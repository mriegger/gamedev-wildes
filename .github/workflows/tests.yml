          version: "4.7"
      - name: Validate masonry block content
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "MASONRY_BLOCK_CONTENT PASS" /tmp/masonry_block_content.log -- \
            godot --headless --path src --script res://blocks/tests/masonry_block_content.gd

