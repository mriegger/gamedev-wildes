name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Boot project headlessly
        run: |
          bash .github/scripts/run_godot_check.sh \
            60 "Godot Engine v4.7" /tmp/headless_boot.log -- \
            godot --path src --headless --quit

  block-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run block content tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "BLOCK_CONTENT PASS" /tmp/block_content.log -- \
            godot --headless --path src --script res://blocks/tests/block_content.gd
      - name: Run block world edit tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "BLOCK_WORLD_EDITS PASS" /tmp/block_world_edits.log -- \
            godot --headless --path src --script res://blocks/tests/block_world_edits.gd
      - name: Run voxel world transaction tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "VOXEL_WORLD_TRANSACTIONS PASS" /tmp/voxel_world_transactions.log -- \
            godot --headless --path src --script res://blocks/tests/voxel_world_transactions.gd
      - name: Run deterministic voxel raycast tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "VOXEL_RAYCAST PASS" /tmp/voxel_raycast.log -- \
            godot --headless --path src --script res://blocks/tests/voxel_raycast.gd

  masonry-block-content:
