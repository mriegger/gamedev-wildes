      - name: Run crafting system tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "CRAFTING_SYSTEM PASS" /tmp/crafting_system.log -- \
            godot --headless --path src --script res://crafting/tests/crafting_system.gd

