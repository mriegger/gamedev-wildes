name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Boot project headlessly
        run: |
          bash .github/scripts/run_godot_check.sh \
            60 "Godot Engine v4.7" /tmp/headless_boot.log -- \
            godot --path src --headless --quit

  inventory-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run inventory fuzz tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            120 "ALL PASS" /tmp/inventory_fuzz.log -- \
            godot --headless --path src --script res://tests/inventory_fuzz_runner.gd -- --seqs=20000 --ops=20

  world-golden-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run world golden hash determinism
        run: |
          bash .github/scripts/run_godot_check.sh \
            60 "GOLDEN PASS" /tmp/world_golden_hash.log -- \
            godot --headless --path src --script res://tests/world_golden_hash.gd

  world-edit-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run world edit spatial-index tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            60 "WORLD_EDIT_INDEX PASS" /tmp/world_edit_index.log -- \
            godot --headless --path src --script res://tests/world_edit_index.gd

  hud-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run HUD headless integration (orphan + preview leak)
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "HUD_INTEGRATION PASS" /tmp/hud_integration.log -- \
            godot --headless --path src --script res://tests/hud_integration.gd

  player-animation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run player animation integration
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "PLAYER_ANIMATION PASS" /tmp/player_animation.log -- \
            godot --headless --path src --script res://tests/player_animation_integration.gd

  animation-tuning-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run animation tuning panel integration
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "ANIMATION_TUNING PASS" /tmp/animation_tuning.log -- \
            godot --headless --path src --script res://tests/animation_tuning_panel_integration.gd

  tool-system-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run tool system integration
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "TOOL_SYSTEM PASS" /tmp/tool_system.log -- \
            godot --headless --path src --script res://tests/tool_system_integration.gd

  audio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run ambient audio integration
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "AUDIO_AMBIENT PASS" /tmp/audio_ambient.log -- \
            godot --headless --path src --script res://tests/audio_ambient_integration.gd
      - name: Run footstep audio integration
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "AUDIO_FOOTSTEPS PASS" /tmp/audio_footsteps.log -- \
            godot --headless --path src --script res://tests/audio_footsteps_integration.gd
      - name: Run action audio integration
        run: |
          bash .github/scripts/run_godot_check.sh \
            30 "AUDIO_ACTION PASS" /tmp/audio_action.log -- \
            godot --headless --path src --script res://tests/audio_action_integration.gd

  soak-world-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run world streaming soak (bounded chunks + orphan + threading)
        run: |
          bash .github/scripts/run_godot_check.sh \
            90 "SOAK PASS" /tmp/soak.log -- \
            godot --headless --path src --script res://tests/soak_world_streaming.gd
