name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Boot project headlessly
        run: |
          bash .github/scripts/run_godot_check.sh \
            60 "Godot Engine v4.7" /tmp/headless_boot.log -- \
            godot --path src --headless --quit

  inventory-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
          version: "4.7"
      - name: Run inventory fuzz tests
        run: |
          bash .github/scripts/run_godot_check.sh \
            120 "ALL PASS" /tmp/inventory_fuzz.log -- \
            godot --headless --path src --script res://tests/inventory_fuzz_runner.gd -- --seqs=20000 --ops=20

  crafting-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_godot
        with:
