name: Setup Godot
description: Install Godot 4.7 headless with cache and import project

inputs:
  version:
    description: Godot version
    required: false
    default: "4.7"

runs:
  using: composite
  steps:
    - name: Cache Godot
      uses: actions/cache@v4
      with:
        path: /tmp/godot-cache
        key: godot-${{ inputs.version }}-linux-x86_64

    - name: Install Godot ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        GODOT_VERSION="${{ inputs.version }}"
        CACHE_DIR="/tmp/godot-cache"
        mkdir -p "$CACHE_DIR"
        GODOT_BIN="$CACHE_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
        if [ -f "$GODOT_BIN" ]; then
          echo "Using cached Godot $GODOT_VERSION"
        else
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "Downloading $URL"
          curl -fsSL -o /tmp/godot.zip "$URL"
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
        fi
        sudo cp -f "$GODOT_BIN" /usr/local/bin/godot
        sudo chmod +x /usr/local/bin/godot
        godot --version

    - name: Import project
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path src --import 2>&1 | head -n 100 || true
        test -d src/.godot || echo "no .godot after import (ok for headless)"
