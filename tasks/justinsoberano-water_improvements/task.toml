name = "Lakes, Rivers, Water Realism, and Terrain Optimization"
instruction = "./instruction.md"

[game]
# Controlled vocabularies — see the game-level README.md.
tags = ["sandbox", "building", "exploration"]   # same voxel sandbox; this task adds lake/river biomes + a PBR water render pass
tech-stack-tags = ["godot", "gdscript"]          # Godot 4.7 + GDScript; project.godot sets no rendering_method, so it runs Forward+
assets-used = ["primitives"]                      # cube/box meshes + runtime-generated noise textures — no imported art for water
harness = "Metacode"
# Matched captures of each one-shot build: same fixed seed (424242, forced via
# WorldController.set_seed_override with a cleared user:// so no save slot overrides it),
# same 1280x720 Forward+ window, clock pinned to 12:00 for lake/river and 22:00 for night.
# Each build was asked via ITS OWN generator API where its lakes and rivers are.
screenshots = [
  "./screenshots/claude/lake.png",
  "./screenshots/avocado/lake.png",
  "./screenshots/claude/river.png",
  "./screenshots/avocado/river.png",
  "./screenshots/claude/night.png",
  "./screenshots/avocado/night.png",
]
videos = ["https://pxl.cl/c0ln0"]                 # gold-solution gameplay (PixelCloud) — no per-model gameplay recorded
teaser = "https://pxl.cl/c0ln0"                    # gold-solution highlight (PixelCloud)
base-commit-hash = "ad74ec7a9ad9075bd9bca4e6e3faaa29c9a766af"  # main tip = Task-005 chunk-streaming gold — the src both models start from
commit-hash = "a329031d850e201b4a23fa015cb9ffe50dceb92b"       # Task-006 golden solution (base..commit = the task diff)

# Committed review builds — one entry per platform in ./binaries/. None committed
# (run from source: `godot --path src`); build-macos-release builds the macOS one from commit-hash.
[binaries]
# macos = "./binaries/Wildes-macos.zip"
