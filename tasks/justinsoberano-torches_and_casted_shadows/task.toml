  "./screenshots/claude/night_torches.png",
  "./screenshots/avocado/night_torches.png",
  "./screenshots/claude/many_torches.png",
  "./screenshots/avocado/many_torches.png",
]
videos = ["https://pxl.cl/bSNr3"]                 # gold-solution gameplay (PixelCloud)
teaser = "https://pxl.cl/bSNr3"                    # gold-solution highlight (PixelCloud)
base-commit-hash = "899f8ff61230d74df6dd49c6e8ff89f1becac8e2"  # Task-002 HEAD — the src the models start from
commit-hash = "4165f1d133e76531b177766b991a480581c396c4"       # Task-003 golden solution (base..commit = the task diff)

