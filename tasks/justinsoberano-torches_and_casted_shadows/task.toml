name = "Torches and Casted Shadows"
instruction = "./instruction.md"

[game]
# Controlled vocabularies — see the game-level README.md.
tags = ["sandbox", "building", "exploration"]   # same voxel sandbox; this task is a lighting/render pass (forward_plus + placeable torch lights)
