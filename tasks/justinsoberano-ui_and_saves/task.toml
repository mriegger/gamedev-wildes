name = "User Interface and Saves"
instruction = "./instruction.md"

[game]
# Controlled vocabularies — see the game-level README.md.
tags = ["sandbox", "building", "exploration"]   # same voxel sandbox; this task adds the front-end + save system
tech-stack-tags = ["godot", "gdscript"]          # Godot 4.7 + GDScript, OpenGL (Compatibility) driver
assets-used = ["primitives", "imported"]          # cube/box meshes + shaders (procedural) + one imported font (Roboto Slab, Apache-2.0)
harness = "Metacode"
screenshots = [
  "./screenshots/claude/01_main_menu.png",
  "./screenshots/avocado/01_main_menu.png",
  "./screenshots/claude/02_world_select.png",
  "./screenshots/avocado/02_world_select.png",
  "./screenshots/claude/03_create_world.png",
  "./screenshots/avocado/03_create_world.png",
  "./screenshots/claude/04_pause.png",
  "./screenshots/avocado/04_pause.png",
]
videos = ["https://pxl.cl/bVn9B"]                 # gold-solution gameplay (PixelCloud)
teaser = "https://pxl.cl/bVn9B"                    # gold-solution highlight (PixelCloud)
base-commit-hash = "34c8dc722f22cdfd62a63cef461365700a3fb15a"  # repo state the models start from (== origin/main before this task)
commit-hash = "ef2c9a57c655de8fa7816e22a2f0218d52d318a4"       # this task's golden solution + macOS export config (base..commit = the task diff)

