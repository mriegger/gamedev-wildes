  "./screenshots/claude/noon.png",
  "./screenshots/avocado/noon.png",
  "./screenshots/claude/midnight.png",
  "./screenshots/avocado/midnight.png",
]
videos = ["https://pxl.cl/bSKRZ"]                 # gold-solution gameplay (PixelCloud)
teaser = "https://pxl.cl/bSKRZ"                    # gold-solution highlight (PixelCloud)
